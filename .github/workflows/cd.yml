# main 머지 시 이미지를 빌드해 GHCR에 올리고 EC2에 배포한다.
name: cd

on:
  push:
    branches:
      - main
  workflow_dispatch:

# 배포가 겹치지 않게 한다 (진행 중인 배포는 취소하지 않고 기다린다)
concurrency:
  group: deploy-prod
  cancel-in-progress: false

jobs:
  image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v6

      # 테스트는 PR CI를 통과한 것만 머지되므로 생략한다. 수동 실행 때만 테스트까지 돌린다.
      - name: jar 빌드
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            ./gradlew build
          else
            ./gradlew bootJar
          fi

      - name: 이미지 이름 · 태그
        id: meta
        run: |
          echo "image=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
          echo "tag=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v4

      # context: . 를 명시해야 Git 컨텍스트가 아닌 작업 디렉터리(build/libs/*.jar 포함)로 빌드한다
      - uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: |
            ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.tag }}
            ${{ steps.meta.outputs.image }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: image
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v7

      - name: compose 파일 복사
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          source: deploy/docker-compose.prod.yml
          target: /opt/rain-butler
          strip_components: 1

      - name: 배포 · 백업 스크립트 복사
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          source: deploy/scripts/deploy.sh,deploy/scripts/backup-db.sh
          target: /opt/rain-butler
          strip_components: 2

      # GHCR_TOKEN은 이 job의 GITHUB_TOKEN이라 job이 끝나면 만료된다
      - name: 배포 실행
        uses: appleboy/ssh-action@v1
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_USER: ${{ github.actor }}
          TAG: ${{ needs.image.outputs.tag }}
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          envs: GHCR_TOKEN,GHCR_USER,TAG
          script: |
            set -e
            # 성공 · 실패와 관계없이 GHCR 로그아웃
            trap 'docker logout ghcr.io' EXIT
            chmod +x /opt/rain-butler/deploy.sh /opt/rain-butler/backup-db.sh
            echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin
            /opt/rain-butler/deploy.sh "$TAG"
