# 운영 서버(/opt/rain-butler)용 compose. CD가 매 배포 때 서버에 복사한다.
# 앱은 DB 위치를 .env의 DB_URL로만 안다 → 10월 말 RDS 이전 시 DB_URL만 바꾸고 db 서비스를 멈춘다.
services:
  app:
    image: ${IMAGE_NAME}:${IMAGE_TAG:-latest}
    container_name: rain-butler
    restart: unless-stopped
    env_file: .env
    environment:
      SPRING_PROFILES_ACTIVE: prod
    ports:
      - "127.0.0.1:8080:8080"   # Nginx만 접근. 외부에는 안 열림
    mem_limit: 1000m
    # depends_on: db 는 일부러 두지 않는다 (RDS 이전 후 db를 멈춰도 앱이 떠야 함)
    logging: &default-logging
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  # 10월 말 RDS 이전 전까지 사용하는 서버 DB
  db:
    image: postgres:16
    container_name: rain-butler-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      TZ: Asia/Seoul
    ports:
      - "127.0.0.1:5432:5432"   # IntelliJ SSH 터널용. 외부에는 안 열림
    volumes:
      - rain-butler-db-data:/var/lib/postgresql/data
    mem_limit: 384m
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging: *default-logging

  # 모니터링 수집기: 앱 지표 · 서버 자원 · 앱/Nginx 로그 → Grafana Cloud (설정: monitoring/config.alloy)
  # DB는 RDS라 수집하지 않는다. 접속 정보는 .env의 GRAFANA_* (값이 없어도 컨테이너는 뜨고 전송만 실패)
  alloy:
    image: grafana/alloy:v1.21.3
    container_name: rain-butler-alloy
    restart: unless-stopped
    command:
      - run
      - --server.http.listen-addr=0.0.0.0:12345
      - --storage.path=/var/lib/alloy/data
      - /etc/alloy/config.alloy
    env_file: .env
    ports:
      - "127.0.0.1:12345:12345"   # Alloy UI는 서버 안 디버깅용. 외부에는 안 열림
    volumes:
      - ./monitoring/config.alloy:/etc/alloy/config.alloy:ro
      - alloy-data:/var/lib/alloy/data
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /var/log/nginx:/var/log/nginx:ro
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/host/root:ro,rslave
    mem_limit: 256m
    logging: *default-logging

volumes:
  rain-butler-db-data:
  alloy-data:
