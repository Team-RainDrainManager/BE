# 빗물받이 집사 API 리버스 프록시
# __DOMAIN__은 bootstrap-ec2.sh가 실제 도메인으로 치환한다.
# 80번 블록만 둔다. 443(HTTPS) 설정은 certbot --nginx가 자동으로 추가한다.

upstream rain_butler {
    server 127.0.0.1:8080;
    keepalive 16;
}

server {
    listen 80;
    listen [::]:80;
    server_name __DOMAIN__;

    server_tokens off;

    # 점검 사진 업로드
    client_max_body_size 20m;

    # 공통 프록시 헤더 (앱은 forward-headers-strategy: native로 읽는다)
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;

    # AI 사진 채점 대비 읽기 · 보내기 여유
    proxy_connect_timeout 5s;
    proxy_read_timeout 90s;
    proxy_send_timeout 90s;

    gzip on;
    gzip_types application/json text/plain text/css application/javascript;

    # Actuator는 외부 차단 (/actuator 자체 포함). 헬스 체크는 서버 안에서 8080으로 직접 한다
    location ^~ /actuator {
        deny all;
    }

    location / {
        proxy_pass http://rain_butler;
    }
}
