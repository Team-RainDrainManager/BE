spring:
  application:
    name: rain-butler
  profiles:
    default: local
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate          # 스키마는 Flyway만 바꾼다
    properties:
      hibernate:
        jdbc:
          time_zone: Asia/Seoul
        default_batch_fetch_size: 100
  flyway:
    enabled: true
    locations: classpath:db/migration
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 20MB
  jackson:
    time-zone: Asia/Seoul
  task:
    scheduling:
      pool:
        size: 2                   # 배치 스레드 (수집 배치가 길어도 다른 배치가 밀리지 않게)
      thread-name-prefix: batch-
      shutdown:
        await-termination: true
  web:
    locale: ko_KR                 # 검증 메시지 등을 요청 언어와 관계없이 한국어로
    locale-resolver: fixed

server:
  port: 8080
  shutdown: graceful

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui
    persist-authorization: true            # 새로고침해도 Authorize 유지
    tags-sorter: alpha
    operations-sorter: method

management:
  endpoints:
    web:
      exposure:
        include: health

rain-butler:
  jwt:
    secret: ${JWT_SECRET}                  # Base64 인코딩된 32바이트 이상
    issuer: rain-butler
    access-token-validity: 30m
    refresh-token-validity: 14d
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
  kakao:
    client-id: ${KAKAO_CLIENT_ID:}          # 카카오 REST API 키
    client-secret: ${KAKAO_CLIENT_SECRET:}
    allowed-redirect-uris: ${KAKAO_ALLOWED_REDIRECT_URIS:http://localhost:5173/oauth/kakao,http://localhost:8080/api/v1/auth/kakao/callback}
  address:
    reverse-geocoding-enabled: ${ADDRESS_REVERSE_GEOCODING_ENABLED:true}  # 좌표 → 주소 (카카오 로컬)
  ai:
    gemini-api-key: ${GEMINI_API_KEY:}       # 비어 있으면 AI 판정 없이 기본값으로 저장
    model: ${GEMINI_MODEL:gemini-3.5-flash-lite}
  s3:
    bucket: ${S3_BUCKET:}                  # 비어 있으면 업로드 API가 STORAGE_NOT_CONFIGURED
    region: ${S3_REGION:ap-northeast-2}
    key-prefix: ${S3_KEY_PREFIX:local}     # 로컬 local, 운영 prod
    access-key: ${S3_ACCESS_KEY:}          # 로컬 전용. 운영은 비워 두고 EC2 IAM Role 사용
    secret-key: ${S3_SECRET_KEY:}
    upload-url-ttl: 5m
    read-url-ttl: 1h
    max-file-size: 10MB
  firebase:
    credentials-base64: ${FIREBASE_CREDENTIALS_BASE64:}   # 서비스 계정 JSON을 base64 한 줄로. 비면 발송 생략
  policy:
    max-adoptions-per-user: 3
    management-cycle-days: 14
    winter-management-cycle-days: 28    # 12월~2월은 서버가 자동 적용
    adoption-warning-days: 28
    adoption-release-days: 35
    substitute-radius-meters: 300
    substitute-daily-limit: 10           # 1인 하루 대신 점검 수락 최대 횟수 (수락 뒤 취소 · 놓침 포함)
    nearby-request-list-limit: 30        # 내 요청 목록의 근처(NEARBY) 요청 최대 개수 (가까운 순)
    nearby-help-radius-meters: 100       # "가능" 응답 · 내 요청 목록에 보여 줄 "근처 도움 필요" 반경 (m). 수락 위치 확인(substitute-radius-meters)과 다른 값
    location-mismatch-meters: 50
    ai-confidence-threshold: 0.7
    rain-notice-time: "06:00"            # 내일 비 예보 요청 일괄 발송 시각
    rain-reply-deadline-time: "12:00"    # 응답 마감 (기존 20:00 → 12:00)
    rain-complete-deadline-time: "20:00" # 완료 마감
    rain-pop-threshold: 60               # 비 예보 기준: 강수확률 최댓값 (%) 이상
    rain-mm-threshold: 5                 # 비 예보 기준: 강수량 합계 (mm) 이상 - 둘 다 만족해야 확정
    same-day-min-lead-hours: 3           # 당일 예보: 비 시작까지 최소 남은 시간
    same-day-reply-hours: 1              # 당일 예보: 응답 마감 = 발송 + 1시간
    same-day-complete-before-rain-hours: 1  # 당일 예보: 완료 마감 = 비 시작 1시간 전
    latest-complete-time: "21:00"        # 당일 예보 완료 마감 상한 (21:00~06:00에 걸리면 직전 21:00)
    night-deferred-push-time: "09:00"    # 야간 푸시 미동의자에게 밤사이 알림을 푸시하는 시각
    lonely-ignore-count: 3               # 연속 무응답 이 횟수 이상이면 "외로운 또랑이" 표시 (불이익 없음)
    min-remaining-minutes-after-advance: 30  # 비가 앞당겨져 남은 시간이 이보다 적으면 요청 취소 (안전 우선)
    adoption-care-time: "09:00"          # 관리 예정 알림(하루 전) · 미관리 경고(28일) · 자동 파양(35일) 배치 시각
    inspection-xp: 5                     # 점검 1회 인정 시 지급 경험치 (개인 참여 점수 · 빗물받이 성장)
    photo-retention-days: 365            # 점검 사진 보존 기간 (촬영일부터 이 일수가 지나면 사진 URL 미제공)
    report-xp: 5                         # 제보 1건을 승인했을 때 지급하는 경험치
    rest-cooldown-days: 90
    night-push-start-time: "22:00"   # 야간 푸시 시간대 (22시~08시는 야간 동의자에게만 발송)
    night-push-end-time: "08:00"
    sanction-first-days: 7           # 허위 제보 제재: 1회 7일 · 2회 14일 · 3회 이상 영구
    sanction-second-days: 14
    sanction-permanent-count: 3
    pause-days: 14                   # 점검 쉬기 기간 (신청 간격은 rest-cooldown-days)
    volunteer-points-per-hour: 100     # 봉사 시간: 활동 점수(개인 포인트 + 빗물받이 성장) 100점당 1시간
  kma:
    auth-key: ${KMA_AUTH_KEY:}             # 기상청 API허브 인증키. 비어 있으면 예보 수집을 건너뛴다
    base-url: https://apihub.kma.go.kr/api/typ02/openApi/VilageFcstInfoService_2.0/getVilageFcst
    ultra-srt-ncst-url: https://apihub.kma.go.kr/api/typ02/openApi/VilageFcstInfoService_2.0/getUltraSrtNcst
    nx: 57                                 # 파일럿 역곡동 격자 (위경도 → 격자 변환으로 확인)
    ny: 125
  scheduling:
    enabled: ${SCHEDULING_ENABLED:true}  # false면 배치가 실행되지 않는다 (테스트 프로필은 false)
