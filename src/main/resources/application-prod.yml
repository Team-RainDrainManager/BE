spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: 10

springdoc:
  # SWAGGER_ENABLED 하나로 UI와 api-docs를 함께 켜고 끈다
  api-docs:
    enabled: ${SWAGGER_ENABLED:false}
  swagger-ui:
    enabled: ${SWAGGER_ENABLED:false}

logging:
  level:
    root: info
  structured:
    format:
      console: ecs   # 운영 로그는 JSON 한 줄 (Grafana Loki에서 requestId · level로 검색). 로컬 · 테스트는 사람이 읽는 형식

server:
  forward-headers-strategy: native   # Nginx 뒤에서 https · 클라이언트 IP 인식

management:
  endpoint:
    health:
      show-details: never
