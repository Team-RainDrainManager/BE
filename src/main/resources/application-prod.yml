spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: 10

springdoc:
  swagger-ui:
    enabled: ${SWAGGER_ENABLED:false}

logging:
  level:
    root: info

server:
  forward-headers-strategy: native   # Nginx 뒤에서 https · 클라이언트 IP 인식

management:
  endpoint:
    health:
      show-details: never
