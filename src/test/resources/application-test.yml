spring:
  datasource:
    hikari:
      # 테스트 컨텍스트가 여러 개 캐시돼도 공용 테스트 DB 연결 한도(100)를 넘지 않게 작게 둔다
      maximum-pool-size: 5
  jpa:
    properties:
      hibernate:
        format_sql: true

# 테스트 전용 고정 값 (실제 키 아님)
rain-butler:
  jwt:
    secret: dGVzdC1vbmx5LWp3dC1zZWNyZXQta2V5LTMyLWJ5dGVzLWxvbmc=
  cors:
    allowed-origins: http://localhost:5173
  kakao:
    client-id: test-kakao-client-id
    client-secret: test-kakao-client-secret
    allowed-redirect-uris: http://localhost:5173/oauth/kakao
  address:
    reverse-geocoding-enabled: false   # 테스트에서 외부 카카오 API를 호출하지 않는다
  s3:
    bucket: test-bucket
    key-prefix: test
    access-key: test-access-key
    secret-key: test-secret-key
  scheduling:
    enabled: false   # 테스트는 배치 메서드를 직접 호출한다
